title: "BuildTest.dev"
name: "BuildTest.dev"
description: "Where DevSecOps dreams come true... or crash spectacularly! 🚀💥"
url: "https://buildtest.dev"
baseurl: ""
locale: "en-AU"
logo: "/favicon-96x96.png"
repository: "jupitertechAU/buildtestdev-simple"

# Build
encoding: "utf-8"
markdown: kramdown
highlighter: rouge
incremental: false
sass:
  style: compressed

# Don't ship the README, ops scripts, etc.
include:
  - .well-known
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - "*.sh"
  - "*.log"
  - .gitattributes
  - .gitignore
  - .git/
  - vendor
  - node_modules
keep_files:
  - .git
  - .well-known

# PWA settings (consumed by manifest.json + sw.js)
pwa:
  enabled: true
  theme_color: "#007bff"
  background_color: "#ffffff"
  icon_192: "/assets/images/maskable_icon_x192.png"
  icon_512: "/assets/images/maskable_icon_x512.png"
  cache_version: "v3"
